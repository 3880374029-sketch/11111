<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>肚脐之战·进化版</title>
<style>
*{margin:0;padding:0}
body{background:#0f0f1a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;user-select:none}
canvas{background:#141428;border:3px solid #e94560;border-radius:16px;box-shadow:0 0 50px rgba(233,69,96,0.3);cursor:none}
#ui{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);padding:8px 20px;border-radius:30px;display:flex;gap:20px;color:#fff;font-size:14px;pointer-events:none;border:1px solid #444;flex-wrap:wrap;justify-content:center}
#ui .bar-wrap{display:flex;align-items:center;gap:6px}
#ui .bar{width:100px;height:8px;background:#2a2a3e;border-radius:4px;overflow:hidden}
#ui .bar div{height:100%;transition:width 0.15s}
.bar.hp div{background:#4ecdc4}
.bar.energy div{background:#f1c40f}
.bar.boss div{background:#ff6b6b}
#ui .combo{color:#f39c12;font-weight:bold;min-width:60px}
#tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#aaa;font-size:12px;background:rgba(0,0,0,0.6);padding:4px 16px;border-radius:20px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="ui">
  <span class="bar-wrap">❤️ <span class="bar hp"><div id="pBar" style="width:100%"></div></span> <span id="pHp">1000</span></span>
  <span class="bar-wrap">⚡ <span class="bar energy"><div id="eBar" style="width:0%"></div></span> <span id="eTxt">0</span></span>
  <span class="bar-wrap">👾 <span class="bar boss"><div id="bBar" style="width:100%"></div></span> <span id="bHp">3000</span></span>
  <span class="combo" id="comboTxt">连击 0</span>
</div>
<div id="tip">鼠标移动 | 左键连射 | 右键蓄力(耗能) | Shift闪避 | E爆发清场</div>
<canvas id="c" width="960" height="640"></canvas>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=960,H=640;

// ----- 玩家 -----
let p={
  x:480,y:550,r:14,
  hp:1000,maxHp:1000,
  energy:0,maxEnergy:100,
  speed:999, // 鼠标直接定位
  cd:0, delay:8, dmg:35, // 普通攻击伤害
  combo:0, comboTimeout:0, // 连击
  dashCooldown:0, dashTimer:0, isDashing:false, dashDir:{x:0,y:0},
  charge:0, isCharging:false, // 蓄力
};
// ----- Boss -----
let b={
  x:480,y:130,w:110,h:90,
  hp:3000,maxHp:3000,
  navelX:0,navelY:32,navelR:24,
  phase:1, // 1或2
  laserCd:0, laserDelay:55,
  summonCd:0, summonDelay:85,
  dead:false,
  moveOffset:0, moveSpeed:0.6,
};
let bullets=[], lasers=[], minions=[], drops=[];

// 鼠标状态
let mouseX=480,mouseY=550;
let mouseLeft=false, mouseRight=false;

// 按键
let keys={shift:false,e:false};

// ----- 事件绑定 -----
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  mouseX=(e.clientX-rect.left)*sx;
  mouseY=(e.clientY-rect.top)*sy;
  mouseX=Math.max(p.r,Math.min(W-p.r,mouseX));
  mouseY=Math.max(p.r,Math.min(H-p.r,mouseY));
});
canvas.addEventListener('mousedown',e=>{
  e.preventDefault();
  if(e.button===0) mouseLeft=true;
  if(e.button===2) {mouseRight=true; p.isCharging=true; p.charge=0;}
});
canvas.addEventListener('mouseup',e=>{
  if(e.button===0) mouseLeft=false;
  if(e.button===2) {
    mouseRight=false;
    if(p.isCharging && p.charge>0.3) { // 蓄力超过0.3秒释放
      if(p.energy>=15) {
        p.energy-=15;
        fireCharge();
      } // 能量不够则取消
    }
    p.isCharging=false; p.charge=0;
  }
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='Shift') keys.shift=true;
  if(e.key==='e'||e.key==='E') keys.e=true;
  if(e.key==='Shift'||e.key==='E') e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='Shift') keys.shift=false;
  if(e.key==='e'||e.key==='E') keys.e=false;
});

// ----- 辅助 -----
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

// ----- 初始化/重置 -----
function reset(){
  p.hp=p.maxHp; p.energy=0; p.combo=0; p.comboTimeout=0; p.dashCooldown=0; p.dashTimer=0; p.isDashing=false; p.cd=0; p.charge=0; p.isCharging=false;
  b.hp=b.maxHp; b.dead=false; b.phase=1; b.laserCd=0; b.summonCd=0; b.moveOffset=0;
  bullets=[]; lasers=[]; minions=[]; drops=[];
  updateUI();
}

function updateUI(){
  document.getElementById('pBar').style.width=Math.max(0,(p.hp/p.maxHp*100))+'%';
  document.getElementById('pHp').innerText=Math.floor(p.hp);
  document.getElementById('eBar').style.width=Math.max(0,(p.energy/p.maxEnergy*100))+'%';
  document.getElementById('eTxt').innerText=Math.floor(p.energy);
  document.getElementById('bBar').style.width=Math.max(0,(b.hp/b.maxHp*100))+'%';
  document.getElementById('bHp').innerText=Math.floor(b.hp);
  document.getElementById('comboTxt').innerText='连击 '+p.combo;
}

// ----- 生成小怪 -----
function spawnMinion(){
  let side=Math.random()<0.5?0:1;
  let spd=0.8+Math.random()*0.7;
  if(b.phase===2) spd*=1.3;
  minions.push({x:side?-25:W+25, y:100+Math.random()*400, r:11, speed:spd, dmg:5, hp:10});
}

// ----- 激光 -----
function fireLaser(){
  let ang=Math.atan2(p.y-b.y, p.x-b.x);
  if(b.phase===2){ // 双激光
    lasers.push({x:b.x,y:b.y,vx:Math.cos(ang-0.2)*7,vy:Math.sin(ang-0.2)*7,r:11,dmg:300,life:200});
    lasers.push({x:b.x,y:b.y,vx:Math.cos(ang+0.2)*7,vy:Math.sin(ang+0.2)*7,r:11,dmg:300,life:200});
  } else {
    lasers.push({x:b.x,y:b.y,vx:Math.cos(ang)*6,vy:Math.sin(ang)*6,r:12,dmg:300,life:250});
  }
}

// ----- 普通射击 -----
function playerShoot(){
  if(p.cd>0||b.dead) return;
  let ang=Math.atan2(b.y-p.y, b.x-p.x);
  // 计算连击加成 (每10连击+1%，上限20%)
  let bonus=Math.min(20, Math.floor(p.combo/10));
  let dmg=p.dmg*(1+bonus/100);
  bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*9,vy:Math.sin(ang)*9,r:5,dmg:dmg,life:200,isCharge:false});
  p.cd=p.delay;
}

// ----- 蓄力攻击（右键释放）-----
function fireCharge(){
  if(b.dead) return;
  let ang=Math.atan2(b.y-p.y, b.x-p.x);
  let bonus=Math.min(20, Math.floor(p.combo/10));
  let dmg=p.dmg*2.5*(1+bonus/100);
  bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*12,vy:Math.sin(ang)*12,r:12,dmg:dmg,life:250,isCharge:true});
}

// ----- 爆发技能（E键）-----
function useBurst(){
  if(b.dead) return;
  let energyUsed=p.energy;
  if(energyUsed<20) return;
  p.energy=0;
  // 对Boss造成伤害
  let dmg=energyUsed*0.8;
  b.hp-=dmg;
  // 清除所有小怪
  minions=[];
  // 掉落一些能量碎片
  for(let i=0;i<3;i++) drops.push({x:b.x+(Math.random()-0.5)*150,y:b.y+30+(Math.random()-0.5)*80,r:6,type:'energy',amount:10});
  updateUI();
  if(b.hp<=0){b.dead=true; alert('爆发带走！牛逼！重玩'); reset(); return;}
}

// ----- 闪避（Shift）-----
function doDash(){
  if(p.dashCooldown>0 || p.isDashing) return;
  // 向鼠标方向冲刺
  let dx=mouseX-p.x, dy=mouseY-p.y;
  let len=Math.hypot(dx,dy);
  if(len<1){dx=0; dy=-1;} else {dx/=len; dy/=len;}
  p.dashDir={x:dx,y:dy};
  p.isDashing=true;
  p.dashTimer=0.3; // 秒
  p.dashCooldown=2.0; // 秒
}

// ----- 掉落物 -----
function spawnDrop(x,y){
  let r=Math.random();
  if(r<0.2){ // 血包
    drops.push({x:x,y:y,r:8,type:'hp',amount:50});
  } else if(r<0.45){ // 能量碎片
    drops.push({x:x,y:y,r:6,type:'energy',amount:20});
  }
}

// ----- 更新 -----
function update(dt){
  if(b.dead||p.hp<=0) return;

  // 玩家直接跟随鼠标
  p.x=mouseX; p.y=mouseY;

  // 冷却
  if(p.cd>0) p.cd-=dt*60;
  if(p.dashCooldown>0) p.dashCooldown-=dt;
  if(p.dashTimer>0){
    p.dashTimer-=dt;
    if(p.dashTimer<=0) p.isDashing=false;
  }
  // 蓄力时间累积
  if(p.isCharging && p.energy>=15){
    p.charge+=dt;
    if(p.charge>1.2) p.charge=1.2; // 最大蓄力时间
  } else if(!mouseRight) p.isCharging=false;

  // 射击
  if(mouseLeft) playerShoot();

  // 闪避
  if(keys.shift) {doDash(); keys.shift=false;}

  // 爆发
  if(keys.e) {useBurst(); keys.e=false;}

  // 连击超时
  if(p.comboTimeout>0){
    p.comboTimeout-=dt;
    if(p.comboTimeout<=0) p.combo=0;
  }

  // Boss阶段
  if(b.hp < b.maxHp*0.5 && b.phase===1){
    b.phase=2;
    b.laserDelay=30;
    b.summonDelay=45;
    b.navelR=18; // 肚脐变小
  }

  // Boss移动（二阶段左右晃）
  if(b.phase===2){
    b.moveOffset+=b.moveSpeed*dt*60;
    b.x=480+Math.sin(b.moveOffset)*80;
  } else {
    b.x=480;
  }

  // Boss技能
  if(b.laserCd<=0){fireLaser(); b.laserCd=b.laserDelay;} else b.laserCd-=dt*60;
  if(b.summonCd<=0){spawnMinion(); b.summonCd=b.summonDelay;} else b.summonCd-=dt*60;

  // ---- 激光碰撞 ----
  for(let i=lasers.length-1;i>=0;i--){
    let l=lasers[i];
    l.x+=l.vx*dt*60; l.y+=l.vy*dt*60;
    l.life-=dt*60;
    if(l.x<-50||l.x>W+50||l.y<-50||l.y>H+50||l.life<=0){lasers.splice(i,1); continue;}
    if(!p.isDashing && dist(l,p)<l.r+p.r){
      p.hp-=l.dmg; lasers.splice(i,1); updateUI();
      if(p.hp<=0){alert('被激光射爆，重来'); reset(); return;}
    }
  }

  // ---- 小怪 ----
  for(let i=minions.length-1;i>=0;i--){
    let m=minions[i];
    let ang=Math.atan2(p.y-m.y, p.x-m.x);
    m.x+=Math.cos(ang)*m.speed*dt*60;
    m.y+=Math.sin(ang)*m.speed*dt*60;
    if(!p.isDashing && dist(m,p)<m.r+p.r){
      p.hp-=m.dmg; minions.splice(i,1); updateUI();
      if(p.hp<=0){alert('被小怪挠死，重来'); reset(); return;}
      continue;
    }
    // 小怪可以被子弹击中（赋予小怪生命值，但为了简单，子弹碰到小怪即消灭并掉落）
    // 我们检测小怪与子弹碰撞
    for(let j=bullets.length-1;j>=0;j--){
      let bu=bullets[j];
      if(dist(bu,m)<bu.r+m.r){
        // 击杀小怪
        spawnDrop(m.x,m.y);
        minions.splice(i,1);
        bullets.splice(j,1);
        break;
      }
    }
    if(m.x<-50||m.x>W+50||m.y<-50||m.y>H+50) minions.splice(i,1);
  }

  // ---- 子弹 ----
  for(let i=bullets.length-1;i>=0;i--){
    let bu=bullets[i];
    bu.x+=bu.vx*dt*60; bu.y+=bu.vy*dt*60;
    bu.life-=dt*60;
    if(bu.x<-20||bu.x>W+20||bu.y<-20||bu.y>H+20||bu.life<=0){bullets.splice(i,1); continue;}
    // 命中Boss
    if(bu.x>=b.x-b.w/2&&bu.x<=b.x+b.w/2&&bu.y>=b.y-b.h/2&&bu.y<=b.y+b.h/2){
      let nX=b.x+b.navelX, nY=b.y+b.navelY;
      let hitNavel=dist(bu,{x:nX,y:nY}) < b.navelR+bu.r;
      let dmg=hitNavel?bu.dmg:bu.dmg*0.7;
      b.hp-=dmg;
      // 连击
      p.combo++;
      p.comboTimeout=2.0; // 2秒内未命中重置
      // 能量获得（每次命中给2能量）
      p.energy=Math.min(p.maxEnergy, p.energy+2);
      // 如果是蓄力弹，额外加能量
      if(bu.isCharge) p.energy=Math.min(p.maxEnergy, p.energy+5);
      bullets.splice(i,1);
      updateUI();
      if(b.hp<=0){b.dead=true; alert('肚脐捅穿！牛逼！重玩'); reset(); return;}
    }
  }

  // ---- 掉落物拾取 ----
  for(let i=drops.length-1;i>=0;i--){
    let d=drops[i];
    if(dist(d,p)<d.r+p.r){
      if(d.type==='hp') p.hp=Math.min(p.maxHp, p.hp+d.amount);
      else if(d.type==='energy') p.energy=Math.min(p.maxEnergy, p.energy+d.amount);
      drops.splice(i,1);
      updateUI();
    }
  }

  // 更新UI（频繁调用不影响）
  updateUI();
}

// ----- 绘制 -----
function draw(){
  ctx.clearRect(0,0,W,H);

  // 网格
  ctx.strokeStyle='#20203a'; ctx.lineWidth=1;
  for(let i=0;i<W;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let i=0;i<H;i+=50){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}

  // Boss
  if(!b.dead){
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=25;
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.shadowColor='#f1c40f'; ctx.shadowBlur=35;
    ctx.fillStyle='#f1c40f'; ctx.beginPath(); ctx.arc(b.x+b.navelX,b.y+b.navelY,b.navelR,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#ecf0f1';
    ctx.beginPath(); ctx.arc(b.x-24,b.y-20,12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x+24,b.y-20,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2c3e50'; ctx.beginPath(); ctx.arc(b.x-27,b.y-22,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x+21,b.y-22,5,0,Math.PI*2); ctx.fill();
    // 阶段标识
    if(b.phase===2){
      ctx.fillStyle='#e74c3c'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
      ctx.fillText('🔥 二阶段', b.x, b.y-b.h/2-20);
    }
  }

  // 小怪
  ctx.shadowColor='#2ecc71'; ctx.shadowBlur=12;
  minions.forEach(m=>{
    ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(m.x-3,m.y-4,5,0,Math.PI*2); ctx.fill();
  });

  // 激光
  ctx.shadowColor='#e74c3c'; ctx.shadowBlur=30;
  lasers.forEach(l=>{
    ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(l.x,l.y,l.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(231,76,60,0.3)'; ctx.beginPath(); ctx.arc(l.x-l.vx*2,l.y-l.vy*2,l.r*1.5,0,Math.PI*2); ctx.fill();
  });

  // 子弹
  ctx.shadowColor='#3498db'; ctx.shadowBlur=14;
  bullets.forEach(bu=>{
    ctx.fillStyle=bu.isCharge?'#f39c12':'#3498db';
    ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r,0,Math.PI*2); ctx.fill();
    if(bu.isCharge){
      ctx.shadowBlur=30; ctx.strokeStyle='#f1c40f'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r+4,0,Math.PI*2); ctx.stroke();
    }
  });

  // 掉落物
  drops.forEach(d=>{
    ctx.shadowBlur=15;
    ctx.fillStyle=d.type==='hp'?'#e74c3c':'#f1c40f';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(d.type==='hp'?'❤️':'⚡',d.x,d.y+4);
  });

  // 玩家
  if(p.isDashing){
    ctx.shadowColor='#4ecdc4'; ctx.shadowBlur=40;
    ctx.fillStyle='#1abc9c'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowColor='#4ecdc4'; ctx.shadowBlur=25;
  ctx.fillStyle='#45b7aa'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#ecf0f1'; ctx.beginPath(); ctx.arc(p.x-5,p.y-6,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2c3e50'; ctx.beginPath(); ctx.arc(p.x-7,p.y-8,2.5,0,Math.PI*2); ctx.fill();

  // 蓄力指示
  if(p.isCharging && p.charge>0){
    let prog=p.charge/1.2;
    ctx.strokeStyle='#f1c40f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+12, -Math.PI/2, -Math.PI/2+prog*Math.PI*2); ctx.stroke();
    ctx.fillStyle='#f1c40f'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('蓄力', p.x, p.y-p.r-18);
  }

  // 准星圈
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([3,6]);
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r+8,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  // 闪避冷却显示
  if(p.dashCooldown>0){
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('闪避冷却 '+p.dashCooldown.toFixed(1)+'s', 10, 30);
  }

  // 状态文字
  if(b.dead){ctx.font='50px sans-serif'; ctx.fillStyle='#f1c40f'; ctx.textAlign='center'; ctx.fillText('💀 胜利',W/2,100);}
  if(p.hp<=0){ctx.font='50px sans-serif'; ctx.fillStyle='#e74c3c'; ctx.textAlign='center'; ctx.fillText('😵 败北',W/2,100);}
}

// ----- 循环 -----
let lastTime=0;
function loop(time){
  let dt=Math.min(0.05, (time-lastTime)/1000);
  lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

reset();
loop(0);
</script>
