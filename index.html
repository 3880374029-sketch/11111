<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ 游戏合集 · Game Collection</title>
<style>
/* ===== 基础 ===== */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100%; }
body {
  background: #0b0815;
  background-image:
    radial-gradient(ellipse at 15% 25%, #1d1533 0%, transparent 55%),
    radial-gradient(ellipse at 85% 75%, #14263a 0%, transparent 55%),
    linear-gradient(160deg, #0e0a1c 0%, #080611 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #e8e0f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 28px 16px 40px;
  overflow-x: hidden;
  position: relative;
}

/* 背景星点（纯 CSS 生成，无外部资源） */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,0.55), transparent),
    radial-gradient(1.2px 1.2px at 78% 12%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1.6px 1.6px at 34% 68%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1.1px 1.1px at 62% 84%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.3px 1.3px at 91% 45%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1.5px 1.5px at 52% 32%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 8% 56%, rgba(255,255,255,0.3), transparent);
  animation: twinkle 5s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }

.cover { position: relative; z-index: 1; width: 100%; max-width: 880px; }

/* ===== 标题 ===== */
header { text-align: center; margin-bottom: 34px; }
.logo-mark {
  font-size: 40px;
  display: block;
  margin-bottom: 6px;
  animation: float 3.4s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
h1 {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #f9d78c, #7ec8e3, #c9a0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.subtitle {
  color: rgba(232,224,240,0.4);
  font-size: 14px;
  letter-spacing: 3px;
}

/* ===== 游戏卡片 ===== */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}
.game-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border-radius: 22px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.07);
  text-decoration: none;
  color: inherit;
  transition: 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
/* 卡片悬浮光晕 */
.game-card::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: 0.3s;
  pointer-events: none;
}
.game-card:hover {
  transform: translateY(-5px);
  border-color: rgba(249,215,140,0.28);
  background: rgba(255,255,255,0.06);
  box-shadow: 0 18px 50px rgba(0,0,0,0.5);
}
.game-card:hover::after { opacity: 1; }
.game-card:active { transform: translateY(-1px) scale(0.99); }

/* 缩略图：用渐变+符号做视觉标识 */
.thumb {
  width: 78px;
  height: 78px;
  flex-shrink: 0;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  position: relative;
}
.thumb.defender {
  background: linear-gradient(135deg, #0d3b66, #00d4ff 140%);
  box-shadow: 0 0 28px rgba(0,212,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.08);
}
.thumb.survivor {
  background: linear-gradient(135deg, #4a2f6b, #f9d78c 150%);
  box-shadow: 0 0 28px rgba(249,215,140,0.2), inset 0 0 0 1px rgba(255,255,255,0.08);
}

.info { flex: 1; min-width: 0; }
.info h2 {
  font-size: 19px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 5px;
  letter-spacing: 0.5px;
}
.info .desc {
  font-size: 12.5px;
  color: rgba(232,224,240,0.45);
  line-height: 1.55;
  margin-bottom: 9px;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span {
  font-size: 10.5px;
  padding: 3px 9px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
  color: rgba(232,224,240,0.55);
  letter-spacing: 0.3px;
}
.game-card:hover .tags span {
  background: rgba(249,215,140,0.08);
  border-color: rgba(249,215,140,0.16);
  color: rgba(249,215,140,0.8);
}
/* 进入箭头 */
.arrow {
  flex-shrink: 0;
  font-size: 20px;
  color: rgba(232,224,240,0.2);
  transition: 0.3s;
}
.game-card:hover .arrow { color: #f9d78c; transform: translateX(4px); }

/* ===== 底部 ===== */
footer {
  margin-top: 30px;
  text-align: center;
  color: rgba(232,224,240,0.2);
  font-size: 11.5px;
  letter-spacing: 1px;
  line-height: 1.8;
}
footer .hint { color: rgba(232,224,240,0.3); }

/* ===== 窄屏 ===== */
@media (max-width: 520px) {
  .game-card { padding: 15px; gap: 13px; }
  .thumb { width: 62px; height: 62px; font-size: 30px; border-radius: 15px; }
  .info h2 { font-size: 17px; }
  .info .desc { font-size: 11.5px; }
  .arrow { display: none; }
  header { margin-bottom: 24px; }
}
</style>
</head>
<body>
<div class="cover">
  <header>
    <span class="logo-mark">🎮</span>
    <h1>✦ 游戏合集</h1>
    <p class="subtitle">选择一个游戏，即刻开始</p>
  </header>

  <div class="game-grid">
    <!-- 星际守卫战 -->
    <a class="game-card" href="defender.html">
      <div class="thumb defender">🚀</div>
      <div class="info">
        <h2>星际守卫战</h2>
        <p class="desc">纵版太空射击。敌机会开火还击，需要走位闪避弹幕；击落可掉落散射、护盾、维修道具，每 5 波迎战 Boss。</p>
        <div class="tags">
          <span>射击</span><span>弹幕闪避</span><span>道具升级</span><span>Boss 战</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- 星际幸存者 -->
    <a class="game-card" href="survivor.html">
      <div class="thumb survivor">✨</div>
      <div class="info">
        <h2>星际幸存者</h2>
        <p class="desc">Roguelike 生存。10 种模式 × 3 档难度，升级时自选强化，支持手柄操作与灵敏度调节。</p>
        <div class="tags">
          <span>生存</span><span>多模式</span><span>升级Build</span><span>手柄</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>

  <footer>
    <div class="hint">两个游戏均可直接在浏览器中运行，无需安装 · 支持桌面键鼠与移动端触屏</div>
    <div>星际守卫战：方向键/WASD 移动，按住左键或空格射击，P/ESC 暂停</div>
    <div>星际幸存者：鼠标/触屏移动（自动射击），空格释放技能</div>
  </footer>
</div>
</body>
</html>
